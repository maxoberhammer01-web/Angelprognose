<style>

<script>
const $=id=>document.getElementById(id),R=Math.PI/180;
const T=(t,o)=>new Date(t).toLocaleString('de-DE',Object.assign({timeZone:'Europe/Berlin',hourCycle:'h23'},o));
const hm=t=>T(t,{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
let S={lat:53.2,lon:11.3,name:'Neu Kaliß / Müritz-Elde-Wasserstraße',pre:true,favs:['hecht','barsch','zander'],spots:[],man:null,useSt:false,catches:[],sp:'hecht',tab:0,ws:'idle',wts:0,H:null,water:null,wst:'idle',msg:'',day:0,hr:new Date().getHours(),live:false,acc:null,lts:0,lmsg:'',pl:[],mz:14,mc:null,pi:null,sc:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('ap1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ap1',JSON.stringify({lat:S.lat,lon:S.lon,name:S.name,pre:S.pre,favs:S.favs,spots:S.spots,man:S.man,useSt:S.useSt,catches:S.catches,sp:S.sp,pl:S.pl,live:S.live}));return true}catch(e){return false}};
// ---- Astronomie (lokal berechnet) ----
function sun(t){const J=Math.floor(t/864e5)+2440587.5,n=Math.ceil(J-2451545+.0008),Js=n-S.lon/360,M=(357.5291+.98560028*Js)%360,C=1.9148*Math.sin(M*R)+.02*Math.sin(2*M*R)+.0003*Math.sin(3*M*R),L=(M+C+180+102.9372)%360,Jt=2451545+Js+.0053*Math.sin(M*R)-.0069*Math.sin(2*L*R),dc=Math.asin(Math.sin(L*R)*Math.sin(23.44*R)),w=Math.acos((Math.sin(-.833*R)-Math.sin(S.lat*R)*Math.sin(dc))/(Math.cos(S.lat*R)*Math.cos(dc))),f=j=>(j-2440587.5)*864e5;return{rise:f(Jt-w/(2*Math.PI)),set:f(Jt+w/(2*Math.PI))}}
function moon(t){const p=(((t/864e5+2440587.5-2451550.1)/29.530588853)%1+1)%1;return{n:['Neumond','zunehmende Sichel','zunehmender Halbmond','zunehmender Mond','Vollmond','abnehmender Mond','abnehmender Halbmond','abnehmende Sichel'][Math.floor(p*8+.5)%8],ill:Math.round((1-Math.cos(2*Math.PI*p))/2*100)}}
// ---- Artenprofile (Heuristik, nicht validiert) ----
const W0={R:{s:14,l:10,c:5,w:7,p:8,t:12,r:5},F:{s:14,l:6,c:3,w:6,p:5,t:14,r:5}};
const mk=(n,g,m,ta,tw,d,hab,me,l)=>({n,g,m,ta,tw,d,hab,me,w:Object.assign({},W0[g],l?{l}:{})});
const SP={
hecht:mk('Hecht','R',[.6,.6,.7,.6,.5,.4,.3,.4,.65,.9,.9,.7],[2,18],[4,16],.3,'Schilf- und Krautkanten, Übergänge flach/tief, Einläufe; im Winter eher ruhige, tiefere Bereiche.','Gummifisch, Wobbler, Spinner; Köderfisch nur, wo erlaubt.'),
barsch:mk('Barsch','R',[.4,.4,.5,.6,.6,.5,.5,.6,.8,.9,.8,.5],[5,22],[8,20],.1,'Kanten, Stege, Spundwände, Krautfelder; oft in Trupps.','Kleine Gummifische, Spinner, Dropshot, Wurm.'),
zander:mk('Zander','R',[.4,.4,.5,.6,.55,.5,.5,.6,.8,.9,.85,.5],[5,22],[8,20],.7,'Kanten, Steinpackungen/Buhnen, tiefere Rinnen; vor allem Dämmerung und Nacht.','Jig mit Gummifisch, Wobbler, Köderfisch.',14),
wels:mk('Wels','R',[.1,.1,.2,.4,.6,.8,.9,.9,.7,.4,.2,.1],[14,28],[16,26],.8,'Tiefe Löcher, Unterstände, Brücken-/Spundwandbereiche; oft dämmerungs- und nachtaktiv.','Große Köderfische, Tauwurm-Bündel, kräftiges Geschirr. Datenlage dünn.',12),
karpfen:mk('Karpfen','F',[.1,.1,.2,.4,.7,.85,.9,.9,.8,.6,.3,.1],[12,28],[14,26],.1,'Krautlücken, Uferkanten, im Frühjahr flache sonnige Bereiche.','Boilies, Mais, Partikel; Grund- oder Futterkorbmontage.'),
brasse:mk('Brasse','F',[.2,.2,.3,.5,.7,.8,.8,.8,.7,.6,.4,.2],[10,26],[12,22],.2,'Grundbereiche, Rinnen, ruhige Buchten.','Futterkorb mit Mais, Made, Wurm.'),
rotauge:mk('Rotauge','F',[.4,.4,.5,.7,.8,.8,.8,.8,.8,.7,.5,.4],[4,24],[6,22],0,'Nahezu überall: Kanten, Stege, leichte Strömung.','Pose/Feeder mit Made, Brot, Mais.')};
const NM={s:'Saison',l:'Licht / Tageszeit',c:'Bewölkung',w:'Wind',p:'Luftdruckverlauf',t:'Temperatur',r:'Niederschlag',e:'Eigene Fänge'};
const DT=(k,x)=>({s:'Monat '+(x.mo+1),l:x.night?'Nacht':Math.round(x.dm)+' min zu Auf-/Untergang',c:x.cloud+' %',w:Math.round(x.wind)+' km/h',p:x.dp==null?'':(x.dp>0?'+':'')+x.dp.toFixed(1)+' hPa/6 h',t:x.wt!=null?'Wasser '+x.wt+' °C ('+x.wts+')':'Luft '+x.temp+' °C (Ersatz, Wassertemp. fehlt)',r:x.rain+' mm/h'})[k];
const rng=(v,[a,b])=>{const m=(a+b)/2,h=(b-a)/2,d=Math.abs(v-m);return d<=h?1-.6*d/h:Math.max(-1,.4-.6*(d-h)/6)};
const F={ // Rückgabe -1..1 oder null (= fehlt, wird nicht gerechnet)
s:(s,x)=>(s.m[x.mo]-.5)*2,
l:(s,x)=>x.night?(s.d-.45)*2:x.dm<=90?1:x.dm<=180?.4:0,
c:(s,x)=>x.cloud==null?null:(s.g=='R'?(x.cloud-50)/50*.7:0),
w:(s,x)=>x.wind==null?null:x.wind<5?.1:x.wind<=20?.8:x.wind<=30?-.2:x.wind<=40?-.7:-1,
p:(s,x)=>x.dp==null?null:Math.abs(x.dp)<1?.3:Math.abs(x.dp)>5?-.7:x.dp<0?.7:.1,
t:(s,x)=>{const w=x.wt!=null,v=w?x.wt:x.temp;return v==null?null:rng(v,w?s.tw:s.ta)},
r:(s,x)=>x.rain==null?null:x.rain<.1?.2:x.rain<1?0:x.rain<3?-.4:-.9};
function model(sp,x){const f=[];let tot=0;for(const k in sp.w){const v=F[k](sp,x);if(v==null)continue;const p=Math.round(sp.w[k]*v);tot+=p;f.push({k,p})}return{score:Math.max(0,Math.min(100,50+tot)),f}}
const LAB=[[20,'sehr ungünstig','bad'],[40,'eher ungünstig','bad'],[60,'mittel','mid'],[80,'gut','good'],[101,'sehr gut','good']];
const lab=v=>{const l=LAB.find(l=>v<l[0]);return[l[1],l[2]]};
const conf=x=>{let c=x.src=='live'?3:x.src=='man'?2:0;if(x.wt!=null)c++;if(x.ah>48)c--;if(x.ah>96)c--;return c>=2?['mittel','mid']:['niedrig','bad']};
function X(t,h,ah){const s=sun(t),x={t,mo:+T(t,{month:'numeric'})-1,dm:Math.min(Math.abs(t-s.rise),Math.abs(t-s.set))/6e4,night:t<s.rise-18e5||t>s.set+18e5,src:'none',ah};
if(h)Object.assign(x,{src:'live',temp:h.temp,cloud:h.cloud,wind:h.wind,gust:h.gust,rain:h.rain,dp:h.dp,wd:h.wd});
if(ah<=24&&ah>-6){if(S.man&&S.man.wt!=null){x.wt=S.man.wt;x.wts='nutzergemessen'}else if(S.useSt&&S.water&&S.water.wt!=null){x.wt=S.water.wt;x.wts='Näherung, Station '+S.water.dist.toFixed(0)+' km'}}return x}
function manX(x){const m=S.man;x.src='man';Object.assign(x,{temp:m.temp,cloud:m.cloud,wind:m.wind,rain:m.rain,dp:m.p!=null&&m.p6!=null?m.p-m.p6:null})}
function ser(k,n){const t0=Date.now(),o=[];if(S.H){S.H.forEach(h=>{if(h.t+36e5>t0&&o.length<n){const x=X(h.t+18e5,h,(h.t-t0)/36e5);o.push({t:h.t,x,m:mdl(k,x)})}})}
else{const b=Math.floor(t0/36e5)*36e5;for(let i=0;i<n;i++){const x=X(b+i*36e5+18e5,null,i);if(i==0&&S.man)manX(x);o.push({t:b+i*36e5,x,m:mdl(k,x)})}}return o}
const cur=k=>{const s=ser(k,24);return{m:s[0].m,x:s[0].x,s}};
const trend=(s,x)=>{if(x.src!='live'||s.length<4)return'';const d=(s[1].m.score+s[2].m.score+s[3].m.score)/3-s[0].m.score;return d>=5?'↗ steigend':d<=-5?'↘ fallend':'→ stabil'};
function best(s){if(s.length<3)return null;let b=-1,bi=0;for(let i=0;i+2<s.length;i++){const a=(s[i].m.score+s[i+1].m.score+s[i+2].m.score)/3;if(a>b){b=a;bi=i}}return{a:s[bi].t,b:s[bi+2].t+36e5,v:Math.round(b)}}
// ---- Daten ----
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x))};
async function jf(u){const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}
const ui=()=>{const e=document.activeElement;if(!e||e.tagName!='INPUT')render()};
async function getWeather(){S.ws='loading';ui();try{const j=await jf('https://api.open-meteo.com/v1/forecast?latitude='+S.lat+'&longitude='+S.lon+'&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_gusts_10m,wind_direction_10m,cloud_cover,precipitation&wind_speed_unit=kmh&timezone=UTC&past_days=30&forecast_days=7');
const h=j.hourly,ok=(v,a,b)=>typeof v=='number'&&v>=a&&v<=b?v:null;
S.H=h.time.map((t,i)=>({t:Date.parse(t+'Z'),temp:ok(h.temperature_2m[i],-50,60),p:ok(h.surface_pressure[i],850,1090),wind:ok(h.wind_speed_10m[i],0,250),gust:ok(h.wind_gusts_10m[i],0,300),cloud:ok(h.cloud_cover[i],0,100),rain:ok(h.precipitation[i],0,200),wd:ok((h.wind_direction_10m||[])[i],0,360)}));
S.H.forEach((r,i)=>{r.dp=i>=6&&r.p!=null&&S.H[i-6].p!=null?r.p-S.H[i-6].p:null});S.ws='live';S.wts=Date.now()}catch(e){S.H=null;S.ws='fail'}ui()}
async function getWater(){S.wst='loading';try{const j=await jf('https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude='+S.lat+'&longitude='+S.lon+'&radius=40&includeTimeseries=true&includeCurrentMeasurement=true');
const g=(s,c)=>{const t=(s.timeseries||[]).find(t=>t.shortname==c);return t&&t.currentMeasurement?{v:t.currentMeasurement.value,u:t.unit,ts:t.currentMeasurement.timestamp}:null};
const L=j.map(s=>({n:s.longname,w:s.water&&s.water.longname,d:hav(S.lat,S.lon,s.latitude,s.longitude),W:g(s,'W'),WT:g(s,'WT')})).filter(s=>!isNaN(s.d)).sort((a,b)=>a.d-b.d).slice(0,5);
const st=L.find(s=>s.WT);S.water={list:L,wt:st?st.WT.v:null,dist:st?st.d:null};S.wst='ok'}catch(e){S.wst='fail';S.water=null}ui()}
const load=()=>{getWeather();getWater()};

const ovLight=()=>{const mo=moon(Date.now());return`<div class="card"><b>☀️ Sonnenbahn heute</b>${sunArc()}</div><div class="card k">${moonSvg()}<div class="g"><b>🌙 ${mo.n}</b><div class="s">${mo.ill} % beleuchtet · nur Anzeige, nicht im Score</div></div></div>${lightBar()}`};
const lure=c=>{const nat=/natürliche/.test(c),a=nat?'#9fb7a0':'#1c2433',b=/Akzent/.test(c)?'#f1f6ff':nat?'#e8f0e0':'#2b3550';
return`<svg class="lr" viewBox="0 0 120 40" role="img" aria-label="Köderfarbe: ${c}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><g class="fb"><path d="M14 20Q30 6 70 8Q100 10 108 20Q100 30 70 32Q30 34 14 20Z" fill="url(#lg)" stroke="#ffffff66"/><circle cx="92" cy="17" r="3" fill="#fff"/><circle cx="92.6" cy="17" r="1.4" fill="#111"/><path d="M14 20L2 10M14 20L2 30" stroke="${a}" stroke-width="5" stroke-linecap="round"/><path d="M60 32l-3 6M76 32l3 6" stroke="#bcc7d6" stroke-width="2"/></g></svg>`};
let CA={};
const SC={hecht:'#22e3a0',barsch:'#ffc53d',zander:'#38bdf8',wels:'#a78bfa',karpfen:'#fb923c',brasse:'#f472b6',rotauge:'#ff6b5e'};
const hr=t=>parseInt(T(t,{hour:'2-digit'})),dk=t=>T(t,{weekday:'short',day:'2-digit',month:'2-digit'});
const serc=k=>CA[k]||(CA[k]=ser(k,168));
const days=k=>CA['d'+k]||(CA['d'+k]=(()=>{const d=[];serc(k).forEach(p=>{const n=dk(p.t);let g=d[d.length-1];if(!g||g.n!=n){g={n,a:[]};d.push(g)}p.hr=hr(p.t);g.a.push(p)});return d})());
function sel(k){const D=days(k);S.day=Math.max(0,Math.min(S.day,D.length-1));const g=D[S.day];let i=g.a.findIndex(p=>p.hr==S.hr);if(i<0){i=g.a.findIndex(p=>p.hr>=S.hr);if(i<0)i=g.a.length-1}return{D,g,i,p:g.a[i]}}
function dchart(k){const{g,i}=sel(k),w=480,h=110,bw=w/Math.max(g.a.length,1);let o=`<svg viewBox="0 0 ${w} ${h+42}" class="ch" role="img" aria-label="Verlauf des Index am gewählten Tag">`;
g.a.forEach((p,j)=>{const v=p.m.score,hh=Math.max(3,v*h/100),on=j==i;o+=`<rect data-a="hr" data-v="${p.hr}" x="${(j*bw+1).toFixed(1)}" y="${(24+h-hh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="var(--${lab(v)[1]})" opacity="${on?1:p.x.night?.45:.8}"${on?' stroke="#fff" stroke-width="2"':''}><title>${hm(p.t)} Uhr: ${v}</title></rect>${p.m.own?`<circle cx="${(j*bw+bw/2).toFixed(1)}" cy="${(24+h-hh-7).toFixed(1)}" r="3.6" fill="#ffd36b33" stroke="#ffd36b" stroke-width="2"/>`:''}`;if(j%3==0||on)o+=`<text x="${(j*bw+bw/2).toFixed(1)}" y="${h+38}" font-size="11" text-anchor="middle" fill="${on?'#fff':'var(--t2)'}">${p.hr}</text>`});
const x=Math.max(14,Math.min(w-14,i*bw+bw/2));return o+`<text x="${x.toFixed(1)}" y="16" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">${g.a[i].m.score}</text></svg>`}
function readout(k){const{g,p}=sel(k),x=p.x,L=lab(p.m.score),c=conf(x),f=(v,u)=>v==null?'–':Math.round(v*10)/10+' '+u,ix=serc(k).indexOf(p);

return`<div class="k" style="--sc:${SC[k]};margin-top:10px">${ring(p.m.score,L[1])}<div class="g"><b>${g.n}, ${hm(p.t)} Uhr</b><div class="${L[1]}" style="font-size:24px;font-weight:700">${p.m.score}<span class="s" style="font-size:13px;font-weight:400"> / 100 · ${L[0]}</span></div><div class="s">${wx}</div><div class="s">Datenvertrauen: ${c[0]}</div>${ownB(p.m)}</div></div><div class="chips">${Object.keys(SP).map(q=>{const v=serc(q)[ix].m.score;return`<span class="ch2" style="border-color:${SC[q]}"><span style="color:${SC[q]}">●</span> ${SP[q].n} <b class="${lab(v)[1]}">${v}</b></span>`}).join('')}</div>`}
const dchips=k=>`<div class="chips">${sel(k).D.map((g,j)=>{const a=g.a.map(p=>p.m.score).sort((x,y)=>y-x),v=Math.round(a.slice(0,3).reduce((x,y)=>x+y,0)/Math.min(3,a.length)),L=lab(v);return`<button class="ch2${S.day==j?' on':''}" style="border-bottom:3px solid var(--${L[1]})" data-a="day" data-v="${j}">${g.n}<br><b class="${L[1]}">${v}</b></button>`}).join('')}</div>`;
function v1(){const k=S.sp,{g,i}=sel(k),b=best(g.a);return pick()+`<div class="card"><span class="fi" style="display:inline-block;width:56px;vertical-align:middle">${fish(k)}</span> <b>${SP[k].n} – Tag &amp; Uhrzeit wählen</b>${dchips(k)}${S.H?'':'<p class="warn">⚠ Keine Wettervorhersage geladen: nur Saison + Licht (berechnet), vorläufig.</p>'}<div id="cs">${dchart(k)}</div><input type="range" id="sl" min="0" max="${g.a.length-1}" value="${i}" aria-label="Uhrzeit"><div class="s">Schieben oder Balken antippen. Dunkler = Nacht. Index 0–100 (keine Prozent). Gold-Kreis = ähnlich wie bei deinen eigenen Fängen.</div><div id="rd">${readout(k)}</div>${b?`<p>Bestes Zeitfenster an diesem Tag: <b>${hm(b.a)}–${hm(b.b)} Uhr</b> (Ø ${b.v})</p>`:''}</div>${zr(k)}<div class="card"><b>7-Tage-Überblick (laut Modell)</b><div class="s">Tagesbestwert = Ø der drei besten Stunden. Je weiter entfernt, desto unsicherer.</div>${week(k)}</div>`}
document.addEventListener('input',e=>{if(e.target.id!='sl')return;const k=S.sp,{g}=sel(k),p=g.a[+e.target.value];if(!p)return;S.hr=p.hr;$('cs').innerHTML=dchart(k);$('rd').innerHTML=readout(k)});
function v2(){const k=S.sp,sp=SP[k],{m,x}=cur(k),L=lab(m.score),c=conf(x);
return pick()+`<div class="wp">${fish(k,1)}</div><div class="card k" data-sc style="--sc:${SC[k]}">${ring(m.score,L[1])}<div class="g"><h2 style="margin:0;color:var(--sc);font-size:20px">${sp.n}</h2><div class="${L[1]}">${L[0]}</div><div class="s">${sp.g=='R'?'Raubfisch':'Friedfisch'} · Datenvertrauen: ${c[0]}</div></div><button class="b" data-a="fav" data-v="${k}">${S.favs.includes(k)?'♥ Favorit':'♡ Favorit'}</button></div>
<div class="card"><b>Einflussfaktoren (aus dem Modell)</b>${m.f.map(f=>`<div class="fr"><span class="${f.p>0?'good':f.p<0?'bad':''}">${f.p>0?'▲ +':f.p<0?'▼ ':'● '}${f.p}</span><span>${NM[f.k]}<span class="s"> – ${f.e?f.e.t:DT(f.k,x)}</span></span></div>`).join('')}<p class="s">${x.wt==null?'Wassertemperatur: keine Daten – Lufttemperatur dient als grober Ersatz. ':''}${x.src=='none'?'Keine Wetterdaten: nur Saison und Licht gehen ein. ':''}Fangdaten: nicht integriert. ${EXP}</p></div>
${out90Card(k)}${sideCard([k],x)}${tipsCard(k,x)}<div class="card"><b>Typische Aufenthaltsbereiche</b><p>${sp.hab}</p><b>Methoden</b><p>${sp.me}</p><p class="s">Allgemeine Orientierung ohne Kenntnis der Gewässerstruktur vor Ort. Schonzeiten, Mindestmaße und Erlaubnisschein bitte selbst prüfen.</p><button class="b" data-a="tocatch">Fang eintragen</button></div>`}
function watr(){if(S.wst=='loading')return'<p class="s">Lade …</p>';if(S.wst!='ok'||!S.water)return'<p class="warn">⚠ Keine verlässlichen Wasserdaten verfügbar (Abruf fehlgeschlagen oder blockiert).</p>';if(!S.water.list.length)return'<p class="s">Keine Messstation im Umkreis von 40 km.</p>';
return S.water.list.map(s=>`<div class="fr"><span>${esc(s.n)}${s.w?' ('+esc(s.w)+')':''}<span class="s"> · ${s.d.toFixed(0)} km</span></span><span class="s">${s.W?'Pegel '+s.W.v+' '+esc(s.W.u):'kein Pegel'}${s.WT?' · '+s.WT.v+' °C ('+hm(Date.parse(s.WT.ts))+')':''}</span></div>`).join('')+(S.water.wt!=null?`<label class="s"><input type="checkbox" data-a="st" ${S.useSt?'checked':''}> Stationstemperatur (${S.water.wt} °C, ${S.water.dist.toFixed(0)} km entfernt) als Näherung verwenden – Station kann an anderem Gewässer liegen</label>`:'<p class="s">Keine Wassertemperatur an Stationen in der Nähe.</p>')}
function v3(){const m=S.man||{};return liveCard()+`<div class="card"><b>Standort</b><p class="s">${esc(S.name)} · ${S.lat.toFixed(3)}, ${S.lon.toFixed(3)}${S.pre?' (ungefähre Koordinaten – Annahme, bitte prüfen)':''}</p><button class="b" data-a="preset">Neu Kaliß / MEW</button>${S.msg?`<p class="warn">⚠ ${esc(S.msg)}</p>`:''}
<div class="fg"><input id="l_n" aria-label="Name" placeholder="Name des Gewässers"><input id="l_a" aria-label="Breite" inputmode="decimal" placeholder="Breite, z. B. 53.2"><input id="l_o" aria-label="Länge" inputmode="decimal" placeholder="Länge, z. B. 11.3"></div><button class="b" data-a="setloc">Übernehmen</button><button class="b" data-a="savespot">Als Favorit speichern</button>
${S.spots.map((p,i)=>`<div class="fr"><span>${esc(p.n)}</span><span><button class="b" data-a="usespot" data-v="${i}">Wählen</button><button class="b" data-a="delspot" data-v="${i}">Löschen</button></span></div>`).join('')}<p class="s">Namenssuche nicht integriert (kein Geocoding-Dienst angebunden).</p></div>
<div class="card"><b>Wasserdaten (PEGELONLINE)</b>${watr()}</div>
<div class="card"><b>Manuelle Eingabe (nutzergemessen)</b><p class="s">Gilt nur für „jetzt“ und ersetzt keine Vorhersage.</p><div class="fg">${[['temp','Lufttemp. °C'],['p','Luftdruck hPa'],['p6','Druck vor 6 h'],['wind','Wind km/h'],['cloud','Bewölkung %'],['rain','Regen mm/h'],['wt','Wassertemp. °C']].map(([k,l])=>`<label class="s">${l}<input id="m_${k}" inputmode="decimal" value="${m[k]==null?'':m[k]}"></label>`).join('')}</div><button class="b" data-a="man">Übernehmen</button><button class="b" data-a="clearman">Zurücksetzen</button></div><button class="b" data-a="refresh">Daten neu laden</button>`}
function v4(){return`${S.sc?scard():''}${mapCard()}<div class="card"><b>Fang eintragen</b><p class="s">Nur auf diesem Gerät gespeichert, nichts wird übertragen.</p>${S.msg?`<p class="warn">⚠ ${esc(S.msg)}</p>`:''}<div class="fg"><input id="c_t" type="datetime-local" aria-label="Zeitpunkt" value="${lt()}"><select id="c_s" aria-label="Art">${Object.keys(SP).map(k=>`<option value="${k}"${S.sp==k?' selected':''}>${SP[k].n}</option>`).join('')}</select><input id="c_l" aria-label="Länge" inputmode="numeric" placeholder="Länge cm"><input id="c_m" aria-label="Methode" placeholder="Methode / Köder"><input id="c_n" aria-label="Notiz" placeholder="Notiz"><select id="c_p" aria-label="Ort"><option value="">Ort: keiner</option>${S.pl.map((p,i)=>`<option value="${i}">${esc(p.n)}</option>`).join('')}<option value="gps">Ort: aktueller Standort</option></select><input id="c_f" type="file" accept="image/*" aria-label="Foto"></div><button class="b" data-a="catchadd">Speichern</button></div>
<div class="card"><b>Meine Fänge</b>${S.catches.length?S.catches.map((c,i)=>`<div class="fr">${c.ph?`<img class="th" src="${c.ph}" alt="Fangfoto">`:''}<span style="flex:1">${SP[c.sp]?SP[c.sp].n:esc(c.sp)}${c.l?' · '+c.l+' cm':''}<span class="s"> · ${T(c.t,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${c.m?' · '+esc(c.m):''}${c.n?' · '+esc(c.n):''} · ${cs(c)}</span></span><span><button class="b" data-a="mk" data-v="${i}">Fangkarte</button><button class="b" data-a="catchdel" data-v="${i}">Löschen</button></span></div>`).join(''):'<p class="s">Noch keine Einträge.</p>'}</div>
<div class="card"><b>Deine Fänge &amp; die Prognose</b><p class="s">Beim Eintragen speichert die App die Bedingungen (Modelldaten, keine Messung). Bei ähnlichen Bedingungen bekommt die Art bis zu +8 Punkte und einen goldenen Kreis. Es zählen nur Erfolge, keine Fehlversuche, und kleine Stichproben: ein Hinweis, keine Fangwahrscheinlichkeit. Alte Einträge ohne Wetter zählen nicht. Fotos werden verkleinert und ohne Metadaten (auch ohne Standort im Foto) gespeichert; Ort und Fotos bleiben auf deinem iPhone.</p></div><div class="card"><b>Community &amp; ähnliche Bedingungen</b><p class="s"><b>Nicht verfügbar.</b> Keine rechtmäßig nutzbare Fangdatenquelle integriert; es werden keine Fangmeldungen simuliert. Der Vergleich bleibt deaktiviert, bis echte Daten vorliegen.</p></div>`}
let AN=true;function render(){CA={};const an=AN;$('a').className=an?'an':'';$('n').className=an?'an':'';AN=false;if(an)setTimeout(()=>{$('a').classList.remove('an');$('n').classList.remove('an')},1200);$('n').innerHTML=['Übersicht','Prognose','Arten','Gewässer','Fangbuch'].map((t,i)=>`<button data-a="tab" data-v="${i}"${S.tab==i?' aria-current="page"':''}>${t}</button>`).join('');$('a').innerHTML=head()+[v0,v1,v2,v3,v4][S.tab]();if(S.tab==4)drawMap()}
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches&&e.target.matches('.k[data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,g=id=>{const el=$(id);return el?el.value:''};
if(a=='tab'){AN=true;S.tab=+v;scrollTo(0,0)}else if(a=='open'){AN=true;S.sp=v;S.tab=2;scrollTo(0,0)}else if(a=='pick')S.sp=v;else if(a=='day')S.day=+v;else if(a=='hr')S.hr=+v;else if(a=='ov'){S.ov=+v;AN=true}
else if(a=='fav')S.favs=S.favs.includes(v)?S.favs.filter(x=>x!=v):S.favs.concat(v);
else if(a=='tocatch'){S.tab=4;scrollTo(0,0)}
else if(a=='lstart'){liveStart();return}else if(a=='lstop'){liveStop();return}else if(a=='preset'){stopW();Object.assign(S,{lat:53.2,lon:11.3,name:'Neu Kaliß / Müritz-Elde-Wasserstraße',pre:true,msg:''});save();load()}
else if(a=='geo'){if(!navigator.geolocation)S.msg='Standortermittlung nicht verfügbar. Du kannst ein Gewässer manuell auswählen.';else{navigator.geolocation.getCurrentPosition(p=>{Object.assign(S,{lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3),name:'Aktueller Standort (ungefähr, Gewässer nicht bestätigt)',pre:false,msg:''});save();load()},()=>{S.msg='Standort nicht freigegeben. Du kannst ein Gewässer manuell auswählen.';render()},{timeout:8000});return}}
else if(a=='setloc'){const la=num(g('l_a')),lo=num(g('l_o'));if(la==null||lo==null||Math.abs(la)>90||Math.abs(lo)>180)S.msg='Bitte gültige Koordinaten eingeben.';else{stopW();Object.assign(S,{lat:la,lon:lo,name:g('l_n').trim()||'Eigener Standort',pre:false,msg:''});save();load()}}
else if(a=='savespot')S.spots.push({n:S.name,lat:S.lat,lon:S.lon});
else if(a=='usespot'){const p=S.spots[+v];if(p){stopW();Object.assign(S,{lat:p.lat,lon:p.lon,name:p.n,pre:false,msg:''});save();load()}}
else if(a=='delspot')S.spots.splice(+v,1);
else if(a=='man'){const o={};['temp','p','p6','wind','cloud','rain','wt'].forEach(k=>o[k]=num(g('m_'+k)));S.man=Object.values(o).some(x=>x!=null)?o:null}
else if(a=='clearman')S.man=null;
else if(a=='st')S.useSt=!S.useSt;
else if(a=='refresh')load();
else if(a=='catchadd'){let t=new Date(g('c_t')).getTime();if(isNaN(t))t=Date.now();const v=g('c_p'),fl=$('c_f')&&$('c_f').files&&$('c_f').files[0],bs={t,sp:g('c_s'),l:num(g('c_l')),m:g('c_m').trim(),n:g('c_n').trim(),c:snap(t)};S.msg='';
const fin=()=>{S.catches.unshift(bs);S.catches.sort((a,b)=>b.t-a.t);if(!save()&&bs.ph){delete bs.ph;S.msg='Speicher voll: Foto nicht gespeichert.';save()}render()};
const pos=()=>{if(v=='gps'&&navigator.geolocation)navigator.geolocation.getCurrentPosition(q=>{bs.pos={lat:+q.coords.latitude.toFixed(4),lon:+q.coords.longitude.toFixed(4)};fin()},()=>{S.msg='Standort nicht verfügbar – Fang ohne Ort gespeichert.';fin()},{timeout:8000});else{if(v!==''&&S.pl[+v])bs.pos={lat:S.pl[+v].lat,lon:S.pl[+v].lon,pn:S.pl[+v].n};fin()}};
if(fl)rp(fl,d=>{if(d)bs.ph=d;pos()});else pos();return}

else if(a=='pp')S.pi={t:b.dataset.t,i:+v};

else if(a=='pz'){const q=S.pl[+v];if(q){S.mc={lat:q.lat,lon:q.lon};S.mz=15;S.pi={t:'p',i:+v}}}
else if(a=='pd'){S.pl.splice(+v,1);S.pi=null}

else if(a=='scx')S.sc=null;
else if(a=='shr'){const u=S.sc.split(','),bn=atob(u[1]),ar=new Uint8Array(bn.length);for(let i=0;i<bn.length;i++)ar[i]=bn.charCodeAt(i);const f=new File([ar],'fang.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Mein Fang'}).catch(()=>{});else S.msg='Teilen nicht möglich: Bild lange drücken und „Zu Fotos hinzufügen“ wählen.'}
save();render()});
$('bg').innerHTML=scene();render();load();if(S.live)liveStart();
</script></body></html>
