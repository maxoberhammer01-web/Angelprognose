<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Angelprognose</title>
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--c1:#141d33;--c2:#1d2a47;--ln:#2c3d63;--tx:#eef3ff;--t2:#aab8d6;--ac:#38bdf8;--good:#22e3a0;--mid:#ffc53d;--bad:#ff6b5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 90px;max-width:720px}
h2{font-size:15px;color:var(--t2);margin:18px 4px 8px;font-weight:600}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.k{display:flex;align-items:center;gap:14px}.k[data-a]{cursor:pointer}.g{flex:1}.rg{width:64px;height:64px;flex:none}
.s{color:var(--t2);font-size:13px}.good{color:var(--good)}.mid,.warn{color:var(--mid)}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch2{background:var(--c2);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:6px 12px;font:13px system-ui}
button.ch2{cursor:pointer;min-height:40px}.on{border-color:var(--ac);color:var(--ac)}
.b{background:var(--c2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer;margin:4px 4px 4px 0}
.b:focus-visible,.ch2:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,.k:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;width:100%;min-height:44px}
input[type=checkbox]{width:auto;min-height:0}
.fr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.ch{width:100%;height:auto}
.wk{display:grid;grid-template-columns:78px 1fr 28px 110px;gap:8px;align-items:center;padding:4px 0;font-size:14px}.wk i{display:block;height:8px;border-radius:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--t2);font:13px system-ui;min-height:56px;cursor:pointer}
nav button[aria-current]{color:var(--ac);font-weight:700;box-shadow:inset 0 2px var(--ac)}
summary{cursor:pointer}
body{background:radial-gradient(900px 420px at 50% -120px,#1b3a73 0,transparent 70%),var(--bg)}
h1{margin:2px 4px 10px;font-size:24px;background:linear-gradient(90deg,var(--ac),var(--good),var(--mid));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(150deg,var(--c1),#0f1730);box-shadow:0 2px 14px #0007}
.k[data-sc]{border-left:5px solid var(--sc)}
.rg{width:72px;height:72px;filter:drop-shadow(0 0 6px #0009)}
.b{background:linear-gradient(135deg,#24508f,var(--c2))}
input[type=range]{background:none;border:0;padding:0;min-height:42px;accent-color:var(--ac)}
nav{background:linear-gradient(180deg,var(--c2),var(--c1))}
</style></head><body><div id="a"></div><nav id="n" aria-label="Hauptnavigation"></nav>
<script>
const $=id=>document.getElementById(id),R=Math.PI/180;
const T=(t,o)=>new Date(t).toLocaleString('de-DE',Object.assign({timeZone:'Europe/Berlin',hourCycle:'h23'},o));
const hm=t=>T(t,{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
let S={lat:53.2,lon:11.3,name:'Neu Kaliß / Müritz-Elde-Wasserstraße',pre:true,favs:['hecht','barsch','zander'],spots:[],man:null,useSt:false,catches:[],sp:'hecht',tab:0,ws:'idle',wts:0,H:null,water:null,wst:'idle',msg:'',day:0,hr:new Date().getHours()};
try{Object.assign(S,JSON.parse(localStorage.getItem('ap1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ap1',JSON.stringify({lat:S.lat,lon:S.lon,name:S.name,pre:S.pre,favs:S.favs,spots:S.spots,man:S.man,useSt:S.useSt,catches:S.catches,sp:S.sp}))}catch(e){}};
// ---- Astronomie (lokal berechnet) ----
function sun(t){const J=Math.floor(t/864e5)+2440587.5,n=Math.ceil(J-2451545+.0008),Js=n-S.lon/360,M=(357.5291+.98560028*Js)%360,C=1.9148*Math.sin(M*R)+.02*Math.sin(2*M*R)+.0003*Math.sin(3*M*R),L=(M+C+180+102.9372)%360,Jt=2451545+Js+.0053*Math.sin(M*R)-.0069*Math.sin(2*L*R),dc=Math.asin(Math.sin(L*R)*Math.sin(23.44*R)),w=Math.acos((Math.sin(-.833*R)-Math.sin(S.lat*R)*Math.sin(dc))/(Math.cos(S.lat*R)*Math.cos(dc))),f=j=>(j-2440587.5)*864e5;return{rise:f(Jt-w/(2*Math.PI)),set:f(Jt+w/(2*Math.PI))}}
function moon(t){const p=(((t/864e5+2440587.5-2451550.1)/29.530588853)%1+1)%1;return{n:['Neumond','zunehmende Sichel','zunehmender Halbmond','zunehmender Mond','Vollmond','abnehmender Mond','abnehmender Halbmond','abnehmende Sichel'][Math.floor(p*8+.5)%8],ill:Math.round((1-Math.cos(2*Math.PI*p))/2*100)}}
// ---- Artenprofile (Heuristik, nicht validiert) ----
const W0={R:{s:14,l:10,c:5,w:7,p:8,t:12,r:5},F:{s:14,l:6,c:3,w:6,p:5,t:14,r:5}};
const mk=(n,g,m,ta,tw,d,hab,me,l)=>({n,g,m,ta,tw,d,hab,me,w:Object.assign({},W0[g],l?{l}:{})});
const SP={
hecht:mk('Hecht','R',[.6,.6,.7,.6,.5,.4,.3,.4,.65,.9,.9,.7],[2,18],[4,16],.3,'Schilf- und Krautkanten, Übergänge flach/tief, Einläufe; im Winter eher ruhige, tiefere Bereiche.','Gummifisch, Wobbler, Spinner; Köderfisch nur, wo erlaubt.'),
barsch:mk('Barsch','R',[.4,.4,.5,.6,.6,.5,.5,.6,.8,.9,.8,.5],[5,22],[8,20],.1,'Kanten, Stege, Spundwände, Krautfelder; oft in Trupps.','Kleine Gummifische, Spinner, Dropshot, Wurm.'),
zander:mk('Zander','R',[.4,.4,.5,.6,.55,.5,.5,.6,.8,.9,.85,.5],[5,22],[8,20],.7,'Kanten, Steinpackungen/Buhnen, tiefere Rinnen; vor allem Dämmerung und Nacht.','Jig mit Gummifisch, Wobbler, Köderfisch.',14),
wels:mk('Wels','R',[.1,.1,.2,.4,.6,.8,.9,.9,.7,.4,.2,.1],[14,28],[16,26],.8,'Tiefe Löcher, Unterstände, Brücken-/Spundwandbereiche; oft dämmerungs- und nachtaktiv.','Große Köderfische, Tauwurm-Bündel, kräftiges Geschirr. Datenlage dünn.',12),
karpfen:mk('Karpfen','F',[.1,.1,.2,.4,.7,.85,.9,.9,.8,.6,.3,.1],[12,28],[14,26],.1,'Krautlücken, Uferkanten, im Frühjahr flache sonnige Bereiche.','Boilies, Mais, Partikel; Grund- oder Futterkorbmontage.'),
brasse:mk('Brasse','F',[.2,.2,.3,.5,.7,.8,.8,.8,.7,.6,.4,.2],[10,26],[12,22],.2,'Grundbereiche, Rinnen, ruhige Buchten.','Futterkorb mit Mais, Made, Wurm.'),
rotauge:mk('Rotauge','F',[.4,.4,.5,.7,.8,.8,.8,.8,.8,.7,.5,.4],[4,24],[6,22],0,'Nahezu überall: Kanten, Stege, leichte Strömung.','Pose/Feeder mit Made, Brot, Mais.')};
const NM={s:'Saison',l:'Licht / Tageszeit',c:'Bewölkung',w:'Wind',p:'Luftdruckverlauf',t:'Temperatur',r:'Niederschlag'};
const DT=(k,x)=>({s:'Monat '+(x.mo+1),l:x.night?'Nacht':Math.round(x.dm)+' min zu Auf-/Untergang',c:x.cloud+' %',w:Math.round(x.wind)+' km/h',p:x.dp==null?'':(x.dp>0?'+':'')+x.dp.toFixed(1)+' hPa/6 h',t:x.wt!=null?'Wasser '+x.wt+' °C ('+x.wts+')':'Luft '+x.temp+' °C (Ersatz, Wassertemp. fehlt)',r:x.rain+' mm/h'})[k];
const rng=(v,[a,b])=>{const m=(a+b)/2,h=(b-a)/2,d=Math.abs(v-m);return d<=h?1-.6*d/h:Math.max(-1,.4-.6*(d-h)/6)};
const F={ // Rückgabe -1..1 oder null (= fehlt, wird nicht gerechnet)
s:(s,x)=>(s.m[x.mo]-.5)*2,
l:(s,x)=>x.night?(s.d-.45)*2:x.dm<=90?1:x.dm<=180?.4:0,
c:(s,x)=>x.cloud==null?null:(s.g=='R'?(x.cloud-50)/50*.7:0),
w:(s,x)=>x.wind==null?null:x.wind<5?.1:x.wind<=20?.8:x.wind<=30?-.2:x.wind<=40?-.7:-1,
p:(s,x)=>x.dp==null?null:Math.abs(x.dp)<1?.3:Math.abs(x.dp)>5?-.7:x.dp<0?.7:.1,
t:(s,x)=>{const w=x.wt!=null,v=w?x.wt:x.temp;return v==null?null:rng(v,w?s.tw:s.ta)},
r:(s,x)=>x.rain==null?null:x.rain<.1?.2:x.rain<1?0:x.rain<3?-.4:-.9};
function model(sp,x){const f=[];let tot=0;for(const k in sp.w){const v=F[k](sp,x);if(v==null)continue;const p=Math.round(sp.w[k]*v);tot+=p;f.push({k,p})}return{score:Math.max(0,Math.min(100,50+tot)),f}}
const LAB=[[20,'sehr ungünstig','bad'],[40,'eher ungünstig','bad'],[60,'mittel','mid'],[80,'gut','good'],[101,'sehr gut','good']];
const lab=v=>{const l=LAB.find(l=>v<l[0]);return[l[1],l[2]]};
const conf=x=>{let c=x.src=='live'?3:x.src=='man'?2:0;if(x.wt!=null)c++;if(x.ah>48)c--;if(x.ah>96)c--;return c>=2?['mittel','mid']:['niedrig','bad']};
function X(t,h,ah){const s=sun(t),x={t,mo:+T(t,{month:'numeric'})-1,dm:Math.min(Math.abs(t-s.rise),Math.abs(t-s.set))/6e4,night:t<s.rise-18e5||t>s.set+18e5,src:'none',ah};
if(h)Object.assign(x,{src:'live',temp:h.temp,cloud:h.cloud,wind:h.wind,gust:h.gust,rain:h.rain,dp:h.dp});
if(ah<=24){if(S.man&&S.man.wt!=null){x.wt=S.man.wt;x.wts='nutzergemessen'}else if(S.useSt&&S.water&&S.water.wt!=null){x.wt=S.water.wt;x.wts='Näherung, Station '+S.water.dist.toFixed(0)+' km'}}return x}
function manX(x){const m=S.man;x.src='man';Object.assign(x,{temp:m.temp,cloud:m.cloud,wind:m.wind,rain:m.rain,dp:m.p!=null&&m.p6!=null?m.p-m.p6:null})}
function ser(k,n){const t0=Date.now(),o=[];if(S.H){S.H.forEach(h=>{if(h.t+36e5>t0&&o.length<n){const x=X(h.t+18e5,h,(h.t-t0)/36e5);o.push({t:h.t,x,m:model(SP[k],x)})}})}
else{const b=Math.floor(t0/36e5)*36e5;for(let i=0;i<n;i++){const x=X(b+i*36e5+18e5,null,i);if(i==0&&S.man)manX(x);o.push({t:b+i*36e5,x,m:model(SP[k],x)})}}return o}
const cur=k=>{const s=ser(k,24);return{m:s[0].m,x:s[0].x,s}};
const trend=(s,x)=>{if(x.src!='live'||s.length<4)return'';const d=(s[1].m.score+s[2].m.score+s[3].m.score)/3-s[0].m.score;return d>=5?'↗ steigend':d<=-5?'↘ fallend':'→ stabil'};
function best(s){if(s.length<3)return null;let b=-1,bi=0;for(let i=0;i+2<s.length;i++){const a=(s[i].m.score+s[i+1].m.score+s[i+2].m.score)/3;if(a>b){b=a;bi=i}}return{a:s[bi].t,b:s[bi+2].t+36e5,v:Math.round(b)}}
// ---- Daten ----
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x))};
async function jf(u){const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}
const ui=()=>{const e=document.activeElement;if(!e||e.tagName!='INPUT')render()};
async function getWeather(){S.ws='loading';ui();try{const j=await jf('https://api.open-meteo.com/v1/forecast?latitude='+S.lat+'&longitude='+S.lon+'&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_gusts_10m,cloud_cover,precipitation&wind_speed_unit=kmh&timezone=UTC&past_hours=12&forecast_days=7');
const h=j.hourly,ok=(v,a,b)=>typeof v=='number'&&v>=a&&v<=b?v:null;
S.H=h.time.map((t,i)=>({t:Date.parse(t+'Z'),temp:ok(h.temperature_2m[i],-50,60),p:ok(h.surface_pressure[i],850,1090),wind:ok(h.wind_speed_10m[i],0,250),gust:ok(h.wind_gusts_10m[i],0,300),cloud:ok(h.cloud_cover[i],0,100),rain:ok(h.precipitation[i],0,200)}));
S.H.forEach((r,i)=>{r.dp=i>=6&&r.p!=null&&S.H[i-6].p!=null?r.p-S.H[i-6].p:null});S.ws='live';S.wts=Date.now()}catch(e){S.H=null;S.ws='fail'}ui()}
async function getWater(){S.wst='loading';try{const j=await jf('https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude='+S.lat+'&longitude='+S.lon+'&radius=40&includeTimeseries=true&includeCurrentMeasurement=true');
const g=(s,c)=>{const t=(s.timeseries||[]).find(t=>t.shortname==c);return t&&t.currentMeasurement?{v:t.currentMeasurement.value,u:t.unit,ts:t.currentMeasurement.timestamp}:null};
const L=j.map(s=>({n:s.longname,w:s.water&&s.water.longname,d:hav(S.lat,S.lon,s.latitude,s.longitude),W:g(s,'W'),WT:g(s,'WT')})).filter(s=>!isNaN(s.d)).sort((a,b)=>a.d-b.d).slice(0,5);
const st=L.find(s=>s.WT);S.water={list:L,wt:st?st.WT.v:null,dist:st?st.d:null};S.wst='ok'}catch(e){S.wst='fail';S.water=null}ui()}
const load=()=>{getWeather();getWater()};
// ---- Darstellung ----
const EXP='Der Wert (0–100) ist ein modellbasierter Index der Bedingungen – keine Fangwahrscheinlichkeit. „72/100“ heißt nicht „72 % Fangchance“. Das Datenvertrauen wird getrennt ausgewiesen.';
const ring=(v,c)=>`<svg class="rg" viewBox="0 0 44 44" role="img" aria-label="${v} von 100"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--ln)" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--${c})" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(v*1.131).toFixed(1)} 113.1" transform="rotate(-90 22 22)"/><text x="22" y="27" text-anchor="middle" fill="currentColor" font-size="14" font-weight="700">${v}</text></svg>`;
function card(k){const{m,x,s}=cur(k),L=lab(m.score),c=conf(x);return`<div class="card k" data-sc style="--sc:${SC[k]}" data-a="open" data-v="${k}" tabindex="0" role="button">${ring(m.score,L[1])}<div class="g"><b style="color:var(--sc);font-size:18px">${SP[k].n}</b> <span class="s">${trend(s,x)}</span><div class="${L[1]}">${L[0]}</div><div class="s">Datenvertrauen: ${c[0]}${x.src=='none'?' · vorläufig (nur Saison + Licht)':''}</div></div></div>`}
function chart(s){const w=480,h=110,bw=w/s.length;let o=`<svg viewBox="0 0 ${w} ${h+16}" class="ch" role="img" aria-label="Stundenverlauf des Index (Werte per Tippen/Hover)">`;
s.forEach((p,i)=>{const v=p.m.score,hh=v*h/100;o+=`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-hh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="var(--${lab(v)[1]})" opacity="${p.x.night?.5:1}"><title>${hm(p.t)} Uhr: ${v} (${lab(v)[0]})</title></rect>`;if(i%3==0)o+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${h+12}" font-size="10" text-anchor="middle" fill="var(--t2)">${T(p.t,{hour:'2-digit'})}</text>`});return o+'</svg>'}
function week(k){if(!S.H)return'<p class="s">Wochenprognose nicht verfügbar: keine Wettervorhersage geladen.</p>';const d={};serc(k).forEach(p=>{const n=T(p.t,{weekday:'short',day:'2-digit',month:'2-digit'});(d[n]=d[n]||[]).push(p.m.score)});
return Object.entries(d).map(([n,a],i)=>{a.sort((x,y)=>y-x);const v=Math.round(a.slice(0,3).reduce((x,y)=>x+y,0)/Math.min(3,a.length)),L=lab(v);return`<div class="wk" style="opacity:${i>4?.65:1}"><span>${n}</span><i style="width:${v}%;background:var(--${L[1]})"></i><b>${v}</b><span class="s">${L[0]}${i>=3?' · vorläufig':''}</span></div>`}).join('')}
function chips(){const w=S.ws=='live'?(Date.now()-S.wts>108e5?'Wetter: veraltet, Stand '+hm(S.wts):'Wetter: Vorhersage (Open-Meteo), abgerufen '+hm(S.wts)):S.ws=='loading'?'Wetter: lädt …':S.man?'Wetter: manuelle Eingabe':'Wetter: nicht verfügbar';
const q=S.wst=='ok'&&S.water?(S.water.wt!=null?'Wasser: Station '+S.water.dist.toFixed(0)+' km entfernt':'Wasser: keine Temperatur'):S.wst=='loading'?'Wasser: lädt …':'Wasser: keine Daten';
return`<div class="chips"><span class="ch2">${w}</span><span class="ch2">${q}</span></div>${S.ws=='fail'&&!S.man?'<p class="warn">⚠ Wetterdaten konnten nicht abgerufen werden. Werte sind vorläufig (nur Saison + Licht). Wetterwerte kannst du unter „Gewässer“ manuell eingeben.</p>':''}`}
const head=()=>`<h1>🎣 Angelprognose</h1><div class="card"><div class="row"><div><b>${esc(S.name)}</b><div class="s">${T(Date.now(),{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'})} Uhr · Standort ${S.pre?'voreingestellt (ungefähr)':'manuell/ermittelt'}</div></div><button class="b" data-a="tab" data-v="3">Ändern</button></div>${chips()}</div>`;
const warn=()=>{const x=cur('hecht').x;return x.gust>=60||x.rain>=4?'<div class="card warn">⚠ Sicherheit zuerst: starke Böen oder Starkregen im Vorhersagedatenpunkt. Offizielle DWD-Warnungen sind nicht angebunden – bei Gewitter nicht ans Wasser.</div>':''};
const pick=()=>`<div class="chips">${Object.keys(SP).map(k=>`<button class="ch2${S.sp==k?' on':''}" style="${S.sp==k?'background:'+SC[k]+';color:#08101f;border-color:'+SC[k]:'border-color:'+SC[k]+'99'}" data-a="pick" data-v="${k}">${SP[k].n}</button>`).join('')}</div>`;
function src(){const ws=S.ws=='live'?'verbunden':S.ws=='loading'?'lädt':'Abruf fehlgeschlagen/blockiert',wa=S.wst=='ok'?'verbunden':S.wst=='loading'?'lädt':'Abruf fehlgeschlagen/blockiert';
return`<details class="card"><summary><b>Datenquellen &amp; Methode</b></summary><ul class="s"><li>Wetter: Open-Meteo, Vorhersage (kein Messwert; CC BY 4.0, nur nichtkommerziell) – Status: ${ws}</li><li>Wasser: PEGELONLINE (WSV) – Pegel/Wassertemperatur nur, wo eine Station im Umkreis meldet – Status: ${wa}</li><li>Sonne/Mond: lokal berechnet</li><li>Fangmeldungen/Community: <b>nicht integriert</b> (keine geprüfte, rechtmäßig nutzbare Schnittstelle). Vergleich „ähnliche Bedingungen“ daher nicht verfügbar.</li><li>DWD-Warnungen, Schonzeiten, Gewässerkarten: nicht angebunden.</li></ul>
<p class="s"><b>Wie wird das berechnet?</b> Startwert 50, dazu Plus-/Minuspunkte je Faktor (Saison, Licht, Bewölkung, Wind, Luftdruckverlauf, Temperatur, Niederschlag) mit artspezifischen Maximalgewichten. Fehlende Daten werden ausgelassen, nicht als Messwert angenommen. Gewichte und Saisonkurven sind Heuristik-Annahmen: noch nicht mit Quellen belegt und nicht mit Fangdaten validiert. Das Datenvertrauen verändert den Score nicht. „Hoch“ würde erst vergeben, wenn auch Fangdaten einfließen – aktuell höchstens „mittel“.</p></details>`}
function v0(){const ks=Object.keys(SP),f=ks.filter(k=>S.favs.includes(k)),r=ks.filter(k=>!f.includes(k)),sn=sun(Date.now()),mo=moon(Date.now());
return`<div class="card s">${EXP}</div>${warn()}<h2>Favoriten</h2>${f.length?f.map(card).join(''):'<p class="s">Noch keine Favoriten (Arten-Seite).</p>'}<h2>Weitere Arten</h2>${r.map(card).join('')}<div class="card"><b>Licht &amp; Mond (berechnet)</b><div class="s">Sonnenaufgang ${hm(sn.rise)} · Sonnenuntergang ${hm(sn.set)} Uhr · Mond: ${mo.n}, ${mo.ill} % beleuchtet (nur Anzeige, nicht im Score)</div></div>${src()}`}
let CA={};
const SC={hecht:'#22e3a0',barsch:'#ffc53d',zander:'#38bdf8',wels:'#a78bfa',karpfen:'#fb923c',brasse:'#f472b6',rotauge:'#ff6b5e'};
const hr=t=>parseInt(T(t,{hour:'2-digit'})),dk=t=>T(t,{weekday:'short',day:'2-digit',month:'2-digit'});
const serc=k=>CA[k]||(CA[k]=ser(k,168));
const days=k=>CA['d'+k]||(CA['d'+k]=(()=>{const d=[];serc(k).forEach(p=>{const n=dk(p.t);let g=d[d.length-1];if(!g||g.n!=n){g={n,a:[]};d.push(g)}p.hr=hr(p.t);g.a.push(p)});return d})());
function sel(k){const D=days(k);S.day=Math.max(0,Math.min(S.day,D.length-1));const g=D[S.day];let i=g.a.findIndex(p=>p.hr==S.hr);if(i<0){i=g.a.findIndex(p=>p.hr>=S.hr);if(i<0)i=g.a.length-1}return{D,g,i,p:g.a[i]}}
function dchart(k){const{g,i}=sel(k),w=480,h=110,bw=w/Math.max(g.a.length,1);let o=`<svg viewBox="0 0 ${w} ${h+42}" class="ch" role="img" aria-label="Verlauf des Index am gewählten Tag">`;
g.a.forEach((p,j)=>{const v=p.m.score,hh=Math.max(3,v*h/100),on=j==i;o+=`<rect data-a="hr" data-v="${p.hr}" x="${(j*bw+1).toFixed(1)}" y="${(24+h-hh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="var(--${lab(v)[1]})" opacity="${on?1:p.x.night?.45:.8}"${on?' stroke="#fff" stroke-width="2"':''}><title>${hm(p.t)} Uhr: ${v}</title></rect>`;if(j%3==0||on)o+=`<text x="${(j*bw+bw/2).toFixed(1)}" y="${h+38}" font-size="11" text-anchor="middle" fill="${on?'#fff':'var(--t2)'}">${p.hr}</text>`});
const x=Math.max(14,Math.min(w-14,i*bw+bw/2));return o+`<text x="${x.toFixed(1)}" y="16" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">${g.a[i].m.score}</text></svg>`}
function readout(k){const{g,p}=sel(k),x=p.x,L=lab(p.m.score),c=conf(x),f=(v,u)=>v==null?'–':Math.round(v*10)/10+' '+u,ix=serc(k).indexOf(p);
const wx=x.src=='live'?`${f(x.temp,'°C')} · Wind ${f(x.wind,'km/h')} · Wolken ${f(x.cloud,'%')} · Regen ${f(x.rain,'mm/h')}`:'Keine Wetterdaten für diese Zeit – nur Saison + Licht (vorläufig)';
return`<div class="k" style="--sc:${SC[k]};margin-top:10px">${ring(p.m.score,L[1])}<div class="g"><b>${g.n}, ${hm(p.t)} Uhr</b><div class="${L[1]}" style="font-size:24px;font-weight:700">${p.m.score}<span class="s" style="font-size:13px;font-weight:400"> / 100 · ${L[0]}</span></div><div class="s">${wx}</div><div class="s">Datenvertrauen: ${c[0]}</div></div></div><div class="chips">${Object.keys(SP).map(q=>{const v=serc(q)[ix].m.score;return`<span class="ch2" style="border-color:${SC[q]}"><span style="color:${SC[q]}">●</span> ${SP[q].n} <b class="${lab(v)[1]}">${v}</b></span>`}).join('')}</div>`}
const dchips=k=>`<div class="chips">${sel(k).D.map((g,j)=>{const a=g.a.map(p=>p.m.score).sort((x,y)=>y-x),v=Math.round(a.slice(0,3).reduce((x,y)=>x+y,0)/Math.min(3,a.length)),L=lab(v);return`<button class="ch2${S.day==j?' on':''}" style="border-bottom:3px solid var(--${L[1]})" data-a="day" data-v="${j}">${g.n}<br><b class="${L[1]}">${v}</b></button>`}).join('')}</div>`;
function v1(){const k=S.sp,{g,i}=sel(k),b=best(g.a);return pick()+`<div class="card"><b>${SP[k].n} – Tag &amp; Uhrzeit wählen</b>${dchips(k)}${S.H?'':'<p class="warn">⚠ Keine Wettervorhersage geladen: nur Saison + Licht (berechnet), vorläufig.</p>'}<div id="cs">${dchart(k)}</div><input type="range" id="sl" min="0" max="${g.a.length-1}" value="${i}" aria-label="Uhrzeit"><div class="s">Schieben oder Balken antippen. Dunkler = Nacht. Index 0–100 (keine Prozent).</div><div id="rd">${readout(k)}</div>${b?`<p>Bestes Zeitfenster an diesem Tag: <b>${hm(b.a)}–${hm(b.b)} Uhr</b> (Ø ${b.v})</p>`:''}</div><div class="card"><b>7-Tage-Überblick (laut Modell)</b><div class="s">Tagesbestwert = Ø der drei besten Stunden. Je weiter entfernt, desto unsicherer.</div>${week(k)}</div>`}
document.addEventListener('input',e=>{if(e.target.id!='sl')return;const k=S.sp,{g}=sel(k),p=g.a[+e.target.value];if(!p)return;S.hr=p.hr;$('cs').innerHTML=dchart(k);$('rd').innerHTML=readout(k)});
function v2(){const k=S.sp,sp=SP[k],{m,x}=cur(k),L=lab(m.score),c=conf(x);
return pick()+`<div class="card k" data-sc style="--sc:${SC[k]}">${ring(m.score,L[1])}<div class="g"><h2 style="margin:0;color:var(--sc);font-size:20px">${sp.n}</h2><div class="${L[1]}">${L[0]}</div><div class="s">${sp.g=='R'?'Raubfisch':'Friedfisch'} · Datenvertrauen: ${c[0]}</div></div><button class="b" data-a="fav" data-v="${k}">${S.favs.includes(k)?'♥ Favorit':'♡ Favorit'}</button></div>
<div class="card"><b>Einflussfaktoren (aus dem Modell)</b>${m.f.map(f=>`<div class="fr"><span class="${f.p>0?'good':f.p<0?'bad':''}">${f.p>0?'▲ +':f.p<0?'▼ ':'● '}${f.p}</span><span>${NM[f.k]}<span class="s"> – ${DT(f.k,x)}</span></span></div>`).join('')}<p class="s">${x.wt==null?'Wassertemperatur: keine Daten – Lufttemperatur dient als grober Ersatz. ':''}${x.src=='none'?'Keine Wetterdaten: nur Saison und Licht gehen ein. ':''}Fangdaten: nicht integriert. ${EXP}</p></div>
<div class="card"><b>Typische Aufenthaltsbereiche</b><p>${sp.hab}</p><b>Methoden</b><p>${sp.me}</p><p class="s">Allgemeine Orientierung ohne Kenntnis der Gewässerstruktur vor Ort. Schonzeiten, Mindestmaße und Erlaubnisschein bitte selbst prüfen.</p><button class="b" data-a="tocatch">Fang eintragen</button></div>`}
function watr(){if(S.wst=='loading')return'<p class="s">Lade …</p>';if(S.wst!='ok'||!S.water)return'<p class="warn">⚠ Keine verlässlichen Wasserdaten verfügbar (Abruf fehlgeschlagen oder blockiert).</p>';if(!S.water.list.length)return'<p class="s">Keine Messstation im Umkreis von 40 km.</p>';
return S.water.list.map(s=>`<div class="fr"><span>${esc(s.n)}${s.w?' ('+esc(s.w)+')':''}<span class="s"> · ${s.d.toFixed(0)} km</span></span><span class="s">${s.W?'Pegel '+s.W.v+' '+esc(s.W.u):'kein Pegel'}${s.WT?' · '+s.WT.v+' °C ('+hm(Date.parse(s.WT.ts))+')':''}</span></div>`).join('')+(S.water.wt!=null?`<label class="s"><input type="checkbox" data-a="st" ${S.useSt?'checked':''}> Stationstemperatur (${S.water.wt} °C, ${S.water.dist.toFixed(0)} km entfernt) als Näherung verwenden – Station kann an anderem Gewässer liegen</label>`:'<p class="s">Keine Wassertemperatur an Stationen in der Nähe.</p>')}
function v3(){const m=S.man||{};return`<div class="card"><b>Standort</b><p class="s">${esc(S.name)} · ${S.lat.toFixed(3)}, ${S.lon.toFixed(3)}${S.pre?' (ungefähre Koordinaten – Annahme, bitte prüfen)':''}</p><button class="b" data-a="preset">Neu Kaliß / MEW</button><button class="b" data-a="geo">Meinen Standort nutzen</button>${S.msg?`<p class="warn">⚠ ${esc(S.msg)}</p>`:''}
<div class="fg"><input id="l_n" aria-label="Name" placeholder="Name des Gewässers"><input id="l_a" aria-label="Breite" inputmode="decimal" placeholder="Breite, z. B. 53.2"><input id="l_o" aria-label="Länge" inputmode="decimal" placeholder="Länge, z. B. 11.3"></div><button class="b" data-a="setloc">Übernehmen</button><button class="b" data-a="savespot">Als Favorit speichern</button>
${S.spots.map((p,i)=>`<div class="fr"><span>${esc(p.n)}</span><span><button class="b" data-a="usespot" data-v="${i}">Wählen</button><button class="b" data-a="delspot" data-v="${i}">Löschen</button></span></div>`).join('')}<p class="s">Namenssuche nicht integriert (kein Geocoding-Dienst angebunden).</p></div>
<div class="card"><b>Wasserdaten (PEGELONLINE)</b>${watr()}</div>
<div class="card"><b>Manuelle Eingabe (nutzergemessen)</b><p class="s">Gilt nur für „jetzt“ und ersetzt keine Vorhersage.</p><div class="fg">${[['temp','Lufttemp. °C'],['p','Luftdruck hPa'],['p6','Druck vor 6 h'],['wind','Wind km/h'],['cloud','Bewölkung %'],['rain','Regen mm/h'],['wt','Wassertemp. °C']].map(([k,l])=>`<label class="s">${l}<input id="m_${k}" inputmode="decimal" value="${m[k]==null?'':m[k]}"></label>`).join('')}</div><button class="b" data-a="man">Übernehmen</button><button class="b" data-a="clearman">Zurücksetzen</button></div><button class="b" data-a="refresh">Daten neu laden</button>`}
function v4(){return`<div class="card"><b>Fang eintragen</b><p class="s">Nur auf diesem Gerät gespeichert, nichts wird übertragen.</p><div class="fg"><select id="c_s" aria-label="Art">${Object.keys(SP).map(k=>`<option value="${k}"${S.sp==k?' selected':''}>${SP[k].n}</option>`).join('')}</select><input id="c_l" aria-label="Länge" inputmode="numeric" placeholder="Länge cm"><input id="c_m" aria-label="Methode" placeholder="Methode / Köder"><input id="c_n" aria-label="Notiz" placeholder="Notiz"></div><button class="b" data-a="catchadd">Speichern</button></div>
<div class="card"><b>Meine Fänge</b>${S.catches.length?S.catches.map((c,i)=>`<div class="fr"><span>${SP[c.sp]?SP[c.sp].n:esc(c.sp)}${c.l?' · '+c.l+' cm':''}<span class="s"> · ${T(c.t,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}${c.m?' · '+esc(c.m):''}${c.n?' · '+esc(c.n):''}</span></span><button class="b" data-a="catchdel" data-v="${i}">Löschen</button></div>`).join(''):'<p class="s">Noch keine Einträge.</p>'}</div>
<div class="card"><b>Community &amp; ähnliche Bedingungen</b><p class="s"><b>Nicht verfügbar.</b> Keine rechtmäßig nutzbare Fangdatenquelle integriert; es werden keine Fangmeldungen simuliert. Der Vergleich bleibt deaktiviert, bis echte Daten vorliegen.</p></div>`}
function render(){CA={};$('n').innerHTML=['Übersicht','Prognose','Arten','Gewässer','Fangbuch'].map((t,i)=>`<button data-a="tab" data-v="${i}"${S.tab==i?' aria-current="page"':''}>${t}</button>`).join('');$('a').innerHTML=head()+[v0,v1,v2,v3,v4][S.tab]()}
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches&&e.target.matches('.k[data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,g=id=>{const el=$(id);return el?el.value:''};
if(a=='tab'){S.tab=+v;scrollTo(0,0)}else if(a=='open'){S.sp=v;S.tab=2;scrollTo(0,0)}else if(a=='pick')S.sp=v;else if(a=='day')S.day=+v;else if(a=='hr')S.hr=+v;
else if(a=='fav')S.favs=S.favs.includes(v)?S.favs.filter(x=>x!=v):S.favs.concat(v);
else if(a=='tocatch'){S.tab=4;scrollTo(0,0)}
else if(a=='preset'){Object.assign(S,{lat:53.2,lon:11.3,name:'Neu Kaliß / Müritz-Elde-Wasserstraße',pre:true,msg:''});save();load()}
else if(a=='geo'){if(!navigator.geolocation)S.msg='Standortermittlung nicht verfügbar. Du kannst ein Gewässer manuell auswählen.';else{navigator.geolocation.getCurrentPosition(p=>{Object.assign(S,{lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3),name:'Aktueller Standort (ungefähr, Gewässer nicht bestätigt)',pre:false,msg:''});save();load()},()=>{S.msg='Standort nicht freigegeben. Du kannst ein Gewässer manuell auswählen.';render()},{timeout:8000});return}}
else if(a=='setloc'){const la=num(g('l_a')),lo=num(g('l_o'));if(la==null||lo==null||Math.abs(la)>90||Math.abs(lo)>180)S.msg='Bitte gültige Koordinaten eingeben.';else{Object.assign(S,{lat:la,lon:lo,name:g('l_n').trim()||'Eigener Standort',pre:false,msg:''});save();load()}}
else if(a=='savespot')S.spots.push({n:S.name,lat:S.lat,lon:S.lon});
else if(a=='usespot'){const p=S.spots[+v];if(p){Object.assign(S,{lat:p.lat,lon:p.lon,name:p.n,pre:false,msg:''});save();load()}}
else if(a=='delspot')S.spots.splice(+v,1);
else if(a=='man'){const o={};['temp','p','p6','wind','cloud','rain','wt'].forEach(k=>o[k]=num(g('m_'+k)));S.man=Object.values(o).some(x=>x!=null)?o:null}
else if(a=='clearman')S.man=null;
else if(a=='st')S.useSt=!S.useSt;
else if(a=='refresh')load();
else if(a=='catchadd')S.catches.unshift({t:Date.now(),sp:g('c_s'),l:num(g('c_l')),m:g('c_m').trim(),n:g('c_n').trim()});
else if(a=='catchdel')S.catches.splice(+v,1);
save();render()});
render();load();
</script></body></html>
